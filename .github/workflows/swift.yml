name: Swift

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Fetch SwiftLint config
        run: |
          curl -fsSL https://raw.githubusercontent.com/Syzygy-Hub/.github/main/engineering/tooling/ios/.swiftlint.yml \
            -o .swiftlint.yml

      - name: SwiftLint
        run: swiftlint --config .swiftlint.yml --reporter github-actions-logging

      - name: Build
        run: swift build

      - name: Test
        run: swift test --xunit-output test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml

  build-ios:
    name: Build (iOS Simulator)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: List available simulators
        run: xcrun simctl list devices available

      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -scheme syzygy-ui-ios \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.5'
