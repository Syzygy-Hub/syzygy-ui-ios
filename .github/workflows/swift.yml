name: Swift

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -switch /Applications/Xcode_16.app

      - name: Build
        run: swift build
        working-directory: ios-ui-library

      - name: Test
        run: swift test --xunit-output test-results.xml
        working-directory: ios-ui-library

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ios-ui-library/test-results.xml
